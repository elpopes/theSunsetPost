name: Swap birthday originals

on:
  push:
    branches:
      - fix/birthday-original-pngs

permissions:
  contents: write

jobs:
  swap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/birthday-original-pngs
          fetch-depth: 0

      - name: Download Mara's original PNGs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p frontend/src/assets/outreach
          curl -L --fail 'https://sdmntprwestus.oaiusercontent.com/files/00000000-4284-8230-a91e-ae5f3ccf0b41/raw?se=2026-09-09T20%3A39%3A05Z&sp=r&sv=2026-02-06&sr=b&scid=459cf341-a988-5af0-b8f7-0e7f1fc1fe9b&skoid=456594af-533f-44ef-9bdc-35ea2f9daee5&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-09T19%3A56%3A42Z&ske=2026-09-10T19%3A56%3A42Z&sks=b&skv=2026-02-06&sig=4HiNFoqrXv/CTSeuHZNxSS9zJelbtlkTi0v1upevrvw%3D' -o frontend/src/assets/outreach/Birthday-Localreach-En.png
          curl -L --fail 'https://sdmntprwestus.oaiusercontent.com/files/00000000-06a0-8230-bcdc-937ed418313e/raw?se=2026-09-09T20%3A39%3A11Z&sp=r&sv=2026-02-06&sr=b&scid=7b6417ac-3dba-5c47-a732-d80d8eedc673&skoid=456594af-533f-44ef-9bdc-35ea2f9daee5&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-09T20%3A04%3A31Z&ske=2026-09-10T20%3A04%3A31Z&sks=b&skv=2026-02-06&sig=%2B8CDJPyxgNJaNcv19DQY%2BJJGImVAK/T9esh%2BGQihIvk%3D' -o frontend/src/assets/outreach/Birthday-Localreach-Es.png
          curl -L --fail 'https://sdmntprwestus.oaiusercontent.com/files/00000000-8274-8230-93ca-7f9e311f8133/raw?se=2026-09-09T20%3A38%3A59Z&sp=r&sv=2026-02-06&sr=b&scid=c12a6c89-b7bc-5be9-9080-476cfd802619&skoid=456594af-533f-44ef-9bdc-35ea2f9daee5&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-09T19%3A57%3A04Z&ske=2026-09-10T19%3A57%3A04Z&sks=b&skv=2026-02-06&sig=iolesCFzH5Pob8aItZvBJXzDOZoWMYiiTqTN39qXC0o%3D' -o frontend/src/assets/outreach/Birthday-Localreach-Zh.png
          curl -L --fail 'https://sdmntprwestus.oaiusercontent.com/files/00000000-f4bc-8230-9499-080fdd9b4dff/raw?se=2026-09-09T20%3A39%3A32Z&sp=r&sv=2026-02-06&sr=b&scid=13b88a0e-5bc1-524e-acd6-7e126a9a5b2d&skoid=456594af-533f-44ef-9bdc-35ea2f9daee5&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-09T20%3A06%3A10Z&ske=2026-09-10T20%3A06%3A10Z&sks=b&skv=2026-02-06&sig=WDG%2BFIKeFJXSFrsohgxU84IKO8nncoI/6pMfpZuh6EA%3D' -o frontend/src/assets/outreach/Birthday-Smartreach-En.png
          curl -L --fail 'https://sdmntprwestus.oaiusercontent.com/files/00000000-9538-8230-8c33-11fb884a2a73/raw?se=2026-09-09T20%3A39%3A39Z&sp=r&sv=2026-02-06&sr=b&scid=b7554a03-bb14-50be-b35e-ebfc54b1d9ef&skoid=456594af-533f-44ef-9bdc-35ea2f9daee5&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-09T20%3A06%3A38Z&ske=2026-09-10T20%3A06%3A38Z&sks=b&skv=2026-02-06&sig=Cnoqn9NiKsH8HUwjPTv%2B0Ua4sii64J8gJbdQYBMY1ds%3D' -o frontend/src/assets/outreach/Birthday-Smartreach-Es.png
          curl -L --fail 'https://sdmntprwestus.oaiusercontent.com/files/00000000-471c-8230-bc45-a9927c89a922/raw?se=2026-09-09T20%3A39%3A21Z&sp=r&sv=2026-02-06&sr=b&scid=c29e75cd-dbde-5dd7-b6cd-b179e49f24fa&skoid=456594af-533f-44ef-9bdc-35ea2f9daee5&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-09T19%3A52%3A30Z&ske=2026-09-10T19%3A52%3A30Z&sks=b&skv=2026-02-06&sig=9ForHG8yNiKoVSFQedu28jnbyMincun%2B5MWLWi9rAXw%3D' -o frontend/src/assets/outreach/Birthday-Smartreach-Zh.png

      - name: Point placements to original files
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/Birthday-Localreach-En\.webp/Birthday-Localreach-En.png/g; s/Birthday-Localreach-Es\.webp/Birthday-Localreach-Es.png/g; s/Birthday-Localreach-Zh\.webp/Birthday-Localreach-Zh.png/g' frontend/src/components/InfoStackSidebar.js
          sed -i 's/Birthday-Smartreach-En\.webp/Birthday-Smartreach-En.png/g; s/Birthday-Smartreach-Es\.webp/Birthday-Smartreach-Es.png/g; s/Birthday-Smartreach-Zh\.webp/Birthday-Smartreach-Zh.png/g' frontend/src/components/InfoBlockMobile.js
          rm -f frontend/src/assets/outreach/Birthday-Localreach-En.webp frontend/src/assets/outreach/Birthday-Localreach-Es.webp frontend/src/assets/outreach/Birthday-Localreach-Zh.webp
          rm -f frontend/src/assets/outreach/Birthday-Smartreach-En.webp frontend/src/assets/outreach/Birthday-Smartreach-Es.webp frontend/src/assets/outreach/Birthday-Smartreach-Zh.webp
          rm -f .github/workflows/swap-birthday-originals.yml

      - name: Commit exact original assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Use Mara original PNG birthday artwork'
          git push origin HEAD:fix/birthday-original-pngs
